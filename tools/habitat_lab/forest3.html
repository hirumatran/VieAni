<!doctype html><html><head><meta charset="utf-8"><title>Habitat directions – Forest</title>
<style>body{margin:0;background:#1b120c;color:#fbe9c4;font-family:sans-serif;padding:16px}canvas{image-rendering:pixelated;width:720px;height:240px;display:block;margin:4px 0 14px;border-radius:8px}h3{margin:6px 0 0;font-size:15px}</style></head><body>
<h3>A · 8-bit NES</h3><canvas id="a" width="240" height="80"></canvas>
<h3>B · 16-bit rừng nhiệt đới (nhiều lớp, sương, nắng xiên)</h3><canvas id="b" width="240" height="80"></canvas>
<h3>C · Tranh Đông Hồ pixel (giấy điệp, nét đen, màu dân gian)</h3><canvas id="c" width="240" height="80"></canvas>
<script>
// Method after huashu-art-motion (MIT) 14_8bit recipe: draw on a low-res canvas, fixed palette, per-layer 1px outline,
// checkerboard dithering, stepped loops; scaled up with nearest-neighbour. Designs are original (VieAni, 19 Nov 2026).
const W = 240, H = 80;
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function layerCanvas() { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; }
/** outline every opaque region of a layer with 1px of `col` (NES sprite look) */
function outline(cv, col) {
  const g = cv.getContext("2d"), im = g.getImageData(0, 0, W, H), d = im.data, op = new Uint8Array(W * H), [r, gg, b] = hex(col);
  for (let i = 0; i < W * H; i++) op[i] = d[i * 4 + 3] > 120 ? 1 : 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; if (op[i]) continue;
    if ((x > 0 && op[i - 1]) || (x < W - 1 && op[i + 1]) || (y > 0 && op[i - W]) || (y < H - 1 && op[i + W])) { d[i*4]=r; d[i*4+1]=gg; d[i*4+2]=b; d[i*4+3]=255; } }
  g.putImageData(im, 0, 0); return cv;
}
const px = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
function disc(g, cx, cy, r, c) { g.fillStyle = c; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y)); g.fillRect(Math.round(cx - w), Math.round(cy + y), 2 * w + 1, 1); } }
/** dithered vertical bands between colours (checkerboard at each boundary) */
function bands(g, y0, y1, cols) { const n = cols.length, h = (y1 - y0) / n;
  for (let y = y0; y < y1; y++) { const t = (y - y0) / h, i = Math.min(n - 1, Math.floor(t)), f = t - i;
    for (let x = 0; x < W; x++) px(g, x, y, 1, 1, i < n - 1 && f > 0.7 && (x + y) % 2 ? cols[i + 1] : cols[i]); } }

// ---------------- A · 8-bit NES ----------------
const A = { sky: ["#3cbcfc", "#68d8fc", "#a4e4fc"], hillFar: "#00a800", hillNear: "#005800", leaf: "#00a800", leafHi: "#58d854", leafDk: "#005800", trunk: "#7c0800", ink: "#000000", white: "#fcfcfc", ground: "#ac7c00", groundHi: "#f8b800" };
function drawA(g, t) {
  bands(g, 0, 44, A.sky);
  const cl = layerCanvas(), c = cl.getContext("2d"); const off = Math.floor(t * 6) % (W + 40);
  for (const [x, y] of [[30, 10], [140, 16], [210, 8]]) { const xx = ((x - off) % (W + 40) + W + 40) % (W + 40) - 20; disc(c, xx, y, 5, A.white); disc(c, xx + 7, y + 1, 4, A.white); disc(c, xx - 6, y + 2, 3, A.white); }
  g.drawImage(outline(cl, A.ink), 0, 0);
  const hl = layerCanvas(), h = hl.getContext("2d");
  for (let x = 0; x < W; x++) { const y = 40 - Math.round(6 * Math.abs(Math.sin(x / 26))); px(h, x, y, 1, H - y, A.hillFar); }
  g.drawImage(outline(hl, A.ink), 0, 0);
  const R = rng(3), tl = layerCanvas(), tg = tl.getContext("2d"), sway = [0, 1, 0, -1][Math.floor(t * 4) % 4];
  for (let i = 0; i < 12; i++) { const x = 8 + i * 20 + R() * 6, y = 44 + R() * 8, r = 7 + Math.floor(R() * 4);
    px(tg, x - 1, y, 3, 16, A.trunk); disc(tg, x + sway * (i % 2), y - 2, r, A.leaf); disc(tg, x - 2 + sway * (i % 2), y - 4, Math.floor(r / 2), A.leafHi); }
  g.drawImage(outline(tl, A.ink), 0, 0);
  px(g, 0, 68, W, 12, A.ground); px(g, 0, 68, W, 1, A.ink);
  for (let x = 0; x < W; x += 8) { px(g, x, 69, 4, 1, A.groundHi); px(g, x + 4, 73, 1, 7, A.ink); }
}

// ---------------- B · 16-bit lush tropical forest ----------------
const B = { sky: ["#f6e7c1", "#cfe8e0", "#9fd3d6", "#7fbcc8"], far: "#6f9c9a", far2: "#4f8584", mist: "#d9ece6", mid: "#2f6b4f", mid2: "#3f8a5a", near: "#1f4a33", lit: "#8fcf6a", lit2: "#c4e47a", trunk: "#4a3628", ray: "#fff4c8", ink: "#16231c", fern: "#5aa04a", flower: "#f39a6b", fly: "#fff3a0" };
function drawB(g, t) {
  bands(g, 0, 50, B.sky);
  // god rays (dithered diagonal strips)
  for (let k = 0; k < 4; k++) for (let y = 0; y < 60; y++) for (let x = 0; x < 6; x++) { const xx = 150 + k * 18 - y * 0.6 + x; if ((xx + y) % 3 === 0) px(g, xx, y, 1, 1, B.ray); }
  const ridge = (base, amp, f, col, ph) => { for (let x = 0; x < W; x++) { const y = Math.round(base - amp * (0.6 * Math.sin(x * f + ph) + 0.4 * Math.sin(x * f * 2.7 + ph))); px(g, x, y, 1, H - y, col); } };
  ridge(30, 7, 0.035, B.far, 1); 
  for (let y = 34; y < 40; y++) for (let x = 0; x < W; x++) if ((x * 3 + y * 5 + Math.floor(t * 4)) % 4 === 0) px(g, x, y, 1, 1, B.mist);
  ridge(40, 5, 0.06, B.far2, 2);
  const R = rng(7);
  const ml = layerCanvas(), m = ml.getContext("2d");
  for (let i = 0; i < 26; i++) { const x = R() * W, y = 44 + R() * 8, r = 6 + R() * 5; disc(m, x, y, r, B.mid); disc(m, x - 2, y - 2, r * 0.6, B.mid2); }
  g.drawImage(outline(ml, B.ink), 0, 0);
  // near layer: big trees with lit rims + swaying ferns
  const nl = layerCanvas(), n = nl.getContext("2d"), sw = Math.round(Math.sin(t * 2.4) * 1.2);
  for (const [x, r] of [[18, 16], [92, 13], [210, 17]]) { px(n, x - 2, 50, 5, 30, B.trunk); disc(n, x, 40, r, B.near); disc(n, x - r * 0.4, 40 - r * 0.4, r * 0.55, B.mid2); disc(n, x - r * 0.5, 40 - r * 0.55, r * 0.25, B.lit); }
  for (let i = 0; i < 18; i++) { const x = R() * W, h = 6 + R() * 6; for (let k = 0; k < h; k++) { px(n, x + Math.round(k / h * sw * 2), 80 - k, 1, 1, B.fern); if (k % 2) px(n, x - 1 + Math.round(k / h * sw * 2), 80 - k, 1, 1, B.lit); } }
  g.drawImage(outline(nl, B.ink), 0, 0);
  px(g, 0, 76, W, 4, B.near);
  for (let i = 0; i < 6; i++) { const x = (R() * W + Math.sin(t * 1.3 + i) * 6), y = 58 + R() * 14 + Math.sin(t * 2 + i * 2) * 2; if (Math.floor(t * 3 + i) % 3) px(g, x, y, 1, 1, B.fly); }
  for (let i = 0; i < 5; i++) px(g, 30 + i * 45, 77, 2, 2, B.flower);
}

// ---------------- C · Đông Hồ folk print, in pixels ----------------
const D = { paper: "#f1dfb4", paperDk: "#e3c88f", ink: "#2b1d14", red: "#c0392b", ochre: "#d99a2b", green: "#4f8a3a", green2: "#77a84a", indigo: "#2f4f6f", pink: "#e98a7f" };
function drawC(g, t) {
  px(g, 0, 0, W, H, D.paper);
  for (let y = 0; y < H; y += 3) for (let x = (y % 2) * 2; x < W; x += 5) px(g, x, y, 1, 1, D.paperDk); // điệp shell sparkle grain
  disc(g, 200, 16, 8, D.red); // sun
  const cl = layerCanvas(), c = cl.getContext("2d"), dx = Math.floor(t * 3) % 8;
  for (const [x, y] of [[40, 12], [120, 8]]) { for (let k = 0; k < 3; k++) { c.strokeStyle = D.indigo; } disc(c, x + dx, y, 4, D.paper); disc(c, x + 6 + dx, y + 1, 3, D.paper); disc(c, x - 5 + dx, y + 2, 3, D.paper); }
  g.drawImage(outline(cl, D.indigo), 0, 0);
  const R = rng(11), tl = layerCanvas(), tg = tl.getContext("2d");
  for (let i = 0; i < 9; i++) { const x = 14 + i * 27 + R() * 4, y = 46 + R() * 6, r = 9 + Math.floor(R() * 4);
    px(tg, x - 1, y, 3, 22, D.ochre);
    // stylised tiered canopy (folk-print "cây" shape)
    for (let k = 0; k < 3; k++) disc(tg, x, y - k * 6, r - k * 3, k % 2 ? D.green2 : D.green); }
  g.drawImage(outline(tl, D.ink), 0, 0);
  // red border band like the frame of a tranh
  px(g, 0, 70, W, 10, D.red); for (let x = 0; x < W; x += 6) { px(g, x, 72, 3, 2, D.ochre); px(g, x + 3, 76, 3, 2, D.paper); }
  px(g, 0, 70, W, 1, D.ink);
  // a pair of folk-print birds flapping (2-frame step)
  const f = Math.floor(t * 4) % 2;
  for (const [bx, by] of [[90 + (t * 8) % 160, 24], [110 + (t * 8) % 160, 30]]) { const x = Math.round(bx) % W; px(g, x, by, 3, 1, D.ink); px(g, x - 2, by - (f ? 2 : 0), 2, 1, D.ink); px(g, x + 3, by - (f ? 2 : 0), 2, 1, D.ink); }
}

const scenes = [["a", drawA], ["b", drawB], ["c", drawC]];
function frame(ts) { const t = ts / 1000; for (const [id, fn] of scenes) { const g = document.getElementById(id).getContext("2d"); g.clearRect(0, 0, W, H); fn(g, t); } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__setTime = (t) => { for (const [id, fn] of scenes) { const g = document.getElementById(id).getContext("2d"); g.clearRect(0, 0, W, H); fn(g, t); } };
</script></body></html>
