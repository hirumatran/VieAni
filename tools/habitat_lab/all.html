<!doctype html><html><head><meta charset="utf-8"><title>Habitat banners</title>
<style>body{margin:0;background:#1b120c;color:#fbe9c4;font-family:sans-serif;padding:10px;display:grid;grid-template-columns:repeat(3,560px);gap:8px 12px}
canvas{image-rendering:pixelated;width:560px;height:180px;display:block;border-radius:6px}div{font-size:13px}</style></head><body>
<script src="../../src/habitats.js"></script>
<script>
for (const n of VieHabitat.names) { const d = document.createElement("div"); d.textContent = n; const c = document.createElement("canvas"); d.appendChild(c); document.body.appendChild(d); c.dataset.h = n; }
window.__at = (t) => document.querySelectorAll("canvas").forEach((c) => VieHabitat.drawAt(c, c.dataset.h, t));
window.__at(1.3);
</script></body></html>
