<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vindex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe3; --panel:#fffaf1; --ink:#2b1d14; --muted:#7a6656; --line:#e4d6c1;
  --lacquer:#8c1c13; --gold:#c9972b; --card:#ffffff; --shadow:0 2px 10px rgba(60,30,10,.10);
  --t-Legendary:#c9972b; --t-Water:#2f74c8; --t-Ground:#a0582c; --t-Rock:#7b6f5e;
  --t-Grass:#3a9a4f; --t-Sky:#2aa7b8; --t-Insect:#8fa81a; --t-Poison:#8a3ca6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17110d; --panel:#211913; --ink:#f3e9db; --muted:#b39f8b; --line:#3a2c21;
    --card:#241b14; --shadow:0 2px 12px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--lacquer),#5a0f0a);color:#fbe9c4;padding:22px 16px 18px;
  border-bottom:4px solid var(--gold)}
.wrap{max-width:1180px;margin:0 auto}
h1{margin:0;font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:.5px}
h1 span{color:var(--gold)}
.sub{margin:4px 0 0;opacity:.85;font-size:14px}
.controls{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search],select{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);min-width:0}
input[type=search]{flex:1 1 240px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:0;cursor:pointer;font:600 12px/1 inherit;font-family:inherit;padding:7px 12px;border-radius:999px;color:#fff;opacity:.45;transition:.15s}
.chip.on{opacity:1;box-shadow:0 0 0 2px var(--panel),0 0 0 4px currentColor}
.chip.all{background:var(--ink);color:var(--bg)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
main{padding:18px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);cursor:pointer;
  overflow:hidden;transition:transform .12s;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column;justify-content:flex-start}
.card>*{width:100%}
.card:hover,.card:focus-visible{transform:translateY(-3px);outline:2px solid var(--gold)}
.art{aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.glyph{width:62%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:34px;color:#fff;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55)}
.tier{position:absolute;top:8px;right:10px;color:#fff;font-size:12px;letter-spacing:1px;text-shadow:0 1px 2px #0006}
.status{position:absolute;top:8px;left:8px;font:700 11px/1 inherit;font-family:inherit;padding:4px 7px;border-radius:6px;background:#000a;color:#fff}
.info{padding:10px 12px 14px}
.no{font-size:13px;color:var(--muted);font-weight:600}
.name{font-weight:800;font-size:16px;margin:2px 0 0;line-height:1.2}
.vi{font-size:13px;color:var(--muted);margin:2px 0 8px}
.types{display:flex;gap:5px;flex-wrap:wrap}
.type{font:600 11px/1 inherit;font-family:inherit;padding:5px 9px;border-radius:6px;color:#fff}
.empty{text-align:center;color:var(--muted);padding:60px 0}
dialog{border:0;border-radius:18px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 10px 40px #0007}
dialog::backdrop{background:#0008}
.d-art{height:180px;display:grid;place-items:center;position:relative}
.d-art .glyph{width:130px;height:130px;font-size:52px}
.d-body{padding:18px 20px 22px}
.d-body h2{margin:0;font-size:24px}
.sci{font-style:italic;color:var(--muted);margin:2px 0 12px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
dt{color:var(--muted);font-weight:600}
dd{margin:0}
.close{position:absolute;top:10px;right:12px;border:0;background:#0006;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Vin<span>dex</span></h1>
  <p class="sub">Linh vật Việt Nam: sinh vật huyền thoại, loài đã mất và loài nguy cấp · Legendary, vanished &amp; endangered creatures of Vietnam</p>
</div></header>

<div class="controls"><div class="wrap">
  <div class="row">
    <input type="search" id="q" placeholder="Search name, Vietnamese name, scientific name or #number…" aria-label="Search">
    <select id="sort" aria-label="Sort">
      <option value="dex">Sort: Number</option>
      <option value="en">Sort: A–Z (English)</option>
      <option value="vi">Sort: A–Z (Tiếng Việt)</option>
      <option value="tier">Sort: Tier (high → low)</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="chips" id="chips"></div>
</div></div>

<main><div class="wrap"><div class="grid" id="grid"></div><p class="empty" id="empty" hidden>No Vinmon match.</p></div></main>
<footer>Draft data — IUCN categories to be re-checked on iucnredlist.org before release. Art is placeholder.</footer>

<dialog id="dlg"></dialog>

  ? `linear-gradient(135deg, ${color(s.types[0])} 0 55%, ${color(s.types[1])} 100%)`
  : color(s.types[0]);

let active = new Set();
const chips = document.getElementById("chips");
const counts = Object.fromEntries(DATA.types.map(t=>[t,DATA.species.filter(s=>s.types.includes(t)).length]));
chips.innerHTML = `<button class="chip all on" data-t="">All</button>` +
  DATA.types.map(t=>`<button class="chip" data-t="${t}" style="background:${color(t)};color:#fff">${t} ${counts[t]}</button>`).join("");
chips.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  const t=b.dataset.t;
  if(!t) active.clear(); else active.has(t)?active.delete(t):active.add(t);
  chips.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c.dataset.t ? active.has(c.dataset.t) : active.size===0));
  render();
});

function render(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const sort=document.getElementById("sort").value;
  let list=DATA.species.filter(s=>{
    if(active.size && !s.types.some(t=>active.has(t))) return false;
    if(!q) return true;
    return [s.en,s.vi,s.sci,pad(s.dex),String(s.dex)].some(v=>v&&v.toLowerCase().includes(q.replace(/^#0*/,"")||q));
  });
  const cmp={dex:(a,b)=>a.dex-b.dex, en:(a,b)=>a.en.localeCompare(b.en,"en"),
    vi:(a,b)=>a.vi.localeCompare(b.vi,"vi"), tier:(a,b)=>STATUS_TIER(b)-STATUS_TIER(a)||a.dex-b.dex}[sort];
  list.sort(cmp);
  document.getElementById("grid").innerHTML=list.map(s=>`
    <button class="card" data-id="${s.id}">
      <div class="art" style="background:${bg(s)}">
        <span class="status">${esc(statusLabel(s))}</span>
        <span class="tier" title="Tier ${STATUS_TIER(s)}">${stars(STATUS_TIER(s))}</span>
        <div class="glyph">${esc(initials(s))}</div>
      </div>
      <div class="info">
        <div class="no">${pad(s.dex)}</div>
        <div class="name">${esc(s.en)}</div>
        <div class="vi">${esc(s.vi)}</div>
        <div class="types">${s.types.map(t=>`<span class="type" style="background:${color(t)}">${t}</span>`).join("")}</div>
      </div>
    </button>`).join("");
  document.getElementById("empty").hidden=list.length>0;
  document.getElementById("count").textContent=`${list.length} / ${DATA.species.length} Vinmon`;
}

const dlg=document.getElementById("dlg");
document.getElementById("grid").addEventListener("click",e=>{
  const c=e.target.closest(".card"); if(!c) return;
  const s=DATA.species.find(x=>x.id==c.dataset.id);
  dlg.innerHTML=`
    <div class="d-art" style="background:${bg(s)}">
      <span class="status">${esc(statusLabel(s))}</span>
      <div class="glyph">${esc(initials(s))}</div>
      <button class="close" aria-label="Close">✕</button>
    </div>
    <div class="d-body">
      <div class="no">${pad(s.dex)} · Tier ${STATUS_TIER(s)} ${stars(STATUS_TIER(s))}</div>
      <h2>${esc(s.en)}</h2>
      <div class="vi" style="font-size:16px">${esc(s.vi)}</div>
      ${s.sci?`<div class="sci">${esc(s.sci)}</div>`:""}
      <div class="types">${s.types.map(t=>`<span class="type" style="background:${color(t)}">${t}</span>`).join("")}</div>
      <dl>
        <dt>Group</dt><dd>${esc(s.group)}</dd>
        ${s.iucn?`<dt>IUCN</dt><dd>${esc(s.iucn)}</dd>`:""}
        ${s.vnStatus?`<dt>In Vietnam</dt><dd>${esc(s.vnStatus)}</dd>`:""}
        <dt>Habitat</dt><dd>${esc(s.habitat)}</dd>
        ${s.typeNote?`<dt>Type note</dt><dd>${esc(s.typeNote)}</dd>`:""}
      </dl>
      <p style="margin:0;line-height:1.5">${esc(s.note)}</p>
    </div>`;
  dlg.showModal();
});
dlg.addEventListener("click",e=>{ if(e.target===dlg||e.target.closest(".close")) dlg.close(); });
["q","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));
render();
</script>
</body>
</html>
