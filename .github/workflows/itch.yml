# Build the game and publish it to https://hirumatran.itch.io/vieani (channel "html5").
# Needs the repository secret BUTLER_API_KEY (itch.io API key).
name: Publish to itch.io

on:
  push:
    branches: [main]
    paths: ["game/**", "data/**", "assets/**", ".github/workflows/itch.yml"]
  workflow_dispatch:

concurrency:
  group: itch-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install butler (itch.io uploader)
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          VERSION=$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)
          "$RUNNER_TEMP/butler/butler" push dist hirumatran/vieani:html5 --userversion "$VERSION"
